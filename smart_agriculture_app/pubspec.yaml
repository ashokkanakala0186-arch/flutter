
name: smart_agriculture_app
description: "Smart Agriculture Monitoring App - monitor farms, crops, weather and receive smart alerts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2

  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  image_picker: ^1.1.2

  speech_to_text: ^7.0.0

  flutter_tts: ^4.2.0

  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
